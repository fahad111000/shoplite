
name: ShopLite CI/CD

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Get Code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/shoplite
            git pull origin main

            sudo docker build -t shoplite-catalog:1.0 ./catalog-service
            sudo docker build -t shoplite-inventory:1.0 ./inventory-service
            sudo docker build -t shoplite-orders:1.0 ./order-service

            sudo docker build --build-arg SERVER_NAME=shopten.duckdns.org -t shoplite-frontend:1.0 ./frontend

            sudo docker rm -f shoplite-catalog shoplite-inventory shoplite-orders shoplite-frontend || true

            sudo docker run -d --name shoplite-catalog --network shoplite-net --network-alias catalog --env-file .env shoplite-catalog:1.0

            sudo docker run -d --name shoplite-inventory --network shoplite-net --network-alias inventory --env-file .env shoplite-inventory:1.0

            sudo docker run -d --name shoplite-orders --network shoplite-net --network-alias orders --env-file .env shoplite-orders:1.0

            sudo docker run -d --name shoplite-frontend --network shoplite-net -p 80:80 shoplite-frontend:1.0

            sudo docker ps

